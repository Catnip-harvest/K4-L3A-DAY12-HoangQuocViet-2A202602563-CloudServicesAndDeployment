# CP5 — Render Blueprint: web service (Docker) + Key Value (Redis-compatible).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
#   - AGENT_API_KEY: `generateValue: true` → Render tự sinh khóa ngẫu nhiên,
#     không có giá trị nào nằm trong repo. Xem/copy khóa trong dashboard
#     (Environment) khi cần gọi /ask.
#   - REDIS_URL: lấy connection string nội bộ của Key Value instance.
#   - `autoDeployTrigger: off`: Render KHÔNG tự deploy theo từng commit.
#     Deploy do job `deploy` của GitHub Actions gọi Deploy Hook, sau khi
#     test + docker + compose-smoke đều xanh (secret RENDER_DEPLOY_HOOK_URL).
#   - Cả hai service cùng region để nối nhau qua mạng nội bộ.

services:
  - type: web
    name: day12-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          name: day12-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: day12-redis
    plan: free
    region: singapore
    # Danh sách rỗng = chặn mọi kết nối từ Internet, chỉ service nội bộ
    # cùng region mới nối được.
    ipAllowList: []
