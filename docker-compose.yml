# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis (+ nginx load balancer)
#
# Một instance (agent :8000 + redis):
#     docker compose up -d --build
#
# Ba replica sau nginx (:8080), dùng thêm file override bỏ cổng host của
# agent để scale được:
#     docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile lb up -d --build --scale agent=3
#
# Secret KHÔNG nằm ở đây: AGENT_API_KEY được compose đọc từ file .env
# (đã .gitignore) cùng thư mục.
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Đợi uvicorn xử lý nốt request đang chạy trước khi Docker SIGKILL
    stop_grace_period: 20s
    restart: unless-stopped

  # Load balancer round-robin trước các replica `agent`.
  # Chỉ bật khi có `--profile lb`, nên `docker compose up` thường vẫn là agent + redis.
  nginx:
    image: nginx:1.27-alpine
    profiles: ["lb"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy

volumes:
  redis-data:
