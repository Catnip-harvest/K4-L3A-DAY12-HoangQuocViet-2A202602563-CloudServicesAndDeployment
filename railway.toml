# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: với service build từ Dockerfile, Railway chạy
# startCommand ở exec form (không qua shell) nên `$PORT` KHÔNG được thay giá
# trị. Để trống thì Railway dùng CMD của Dockerfile, vốn đã đọc ${PORT:-8000}
# và `exec` để uvicorn là PID 1 (nhận SIGTERM trực tiếp).
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
